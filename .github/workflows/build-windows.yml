name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gui_app.py"
      - "run_batch.py"
      - "app/**"
      - "TikTokVideoPerformance.windows.spec"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install pyinstaller
          python -m pip install PySide6
          python -m pip install playwright
          python -m pip install openpyxl

      - name: Install requirements if available
        shell: powershell
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Check source
        run: |
          python -m py_compile gui_app.py
          python -m py_compile run_batch.py
          python -m py_compile app/session_manager.py
          python -m py_compile app/tiktok_login.py
          python -m py_compile app/collectors/tiktok_batch.py

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean TikTokVideoPerformance.windows.spec

      - name: Show dist files
        shell: powershell
        run: |
          Get-ChildItem -Recurse dist

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Video-Performance-Windows-x64
          path: dist/TikTok Video Performance/**
          if-no-files-found: error
          retention-days: 14
